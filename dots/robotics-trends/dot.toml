# 曜日と分野の対応はここに書かない(LLM が日付から曜日を推測して、コードの選んだ分野と食い違う)。対応は tracks.toml にある
description = "平日の午前3時に、コードが選んだ分野・段階の論文を1本ずつ読み、要約を記録する"
enabled = true

[schedule]
at = "03:00"
days = "weekdays"
window = ["03:00", "05:00"]  # 昼間にタスクを登録しても、その日の夜まで動かない

[agent]
# record_paper が次の論文も返すので、1本につき LLM の呼び出しは1回。今日の分(最大30本)を1回の実行で読み切る
max_steps = 45
# 論文どうしは独立しているので、直近のやりとりだけを渡してプロンプトを短く保つ
history_window = 2
instructions_file = "instructions.md"
temperature = 0.2
