# 曜日ごとの分野(track)と、その中で読み進める順番(step)。
# 1回(1晩)で1 step 進む。翌週の同じ曜日は、その続きの step から始まる。
#
#   aim   … その step で掴みたいこと(朝のメールに出る)
#   query … Semantic Scholar の bulk search(| は OR、+ は AND、"..." は語句)
#   part  … 1つの step で複数のテーマを読むときは、query と year を [[track.step.part]] に分けて書く(本数は等分)
#   year  … 何年以降の論文を読むか。基礎の step は古い定番から読む
#   arxiv … その分野の arXiv 新着を拾う検索式(track ごと)
#   folder … レポートを置くフォルダー名(robotics-digest の report_dir の下)
#   week  … "odd" / "even" を付けた分野は隔週(ISO 週番号の奇数週 / 偶数週)。同じ曜日に2つの分野を交互に置ける
#   weekday を書かない分野はお休み(読まない)

[[track]]
key = "navigation"
folder = "1_ナビゲーション"
label = "ナビゲーション"
weekday = "mon"
arxiv = 'cat:cs.RO AND (abs:navigation OR abs:"path planning" OR abs:"motion planning")'

  [[track.step]]
  key = "sampling-planning"
  label = "経路計画の基礎(グラフ探索とサンプリング)"
  aim = "A*・PRM・RRT・RRT* が何を解いていて、なぜ今も使われるのか"
  query = '("path planning" | "motion planning") + (RRT | "probabilistic roadmap" | "sampling-based" | "A*")'
  year = "1995-"

  [[track.step]]
  key = "local-planning"
  label = "局所計画と障害物回避"
  aim = "DWA・TEB・MPC など、動きながら避ける仕組みの系譜"
  query = '("local planner" | "dynamic window" | "obstacle avoidance" | "model predictive control") + ("mobile robot" | navigation)'
  year = "1995-"

  [[track.step]]
  key = "trajectory-optimization"
  label = "最適化ベースの軌道計画"
  aim = "CHOMP・TrajOpt から、軌道を最適化問題として解く考え方"
  query = '("trajectory optimization" | CHOMP | TrajOpt | "optimization-based planning") + (robot | manipulator | motion)'
  year = "2009-"

  [[track.step]]
  key = "learned-navigation"
  label = "学習ベースのナビゲーション"
  aim = "強化学習・end-to-end でナビゲーションを学ばせる流れと、その限界"
  query = '("reinforcement learning" | "end-to-end" | "imitation learning") + ("robot navigation" | "visual navigation" | "mobile robot")'
  year = "2016-"

  [[track.step]]
  key = "semantic-navigation"
  label = "意味的ナビゲーション(ObjectNav・VLN)"
  aim = "「台所に行って」のように、意味で行き先を決めるナビゲーション"
  query = '("object goal navigation" | "vision-and-language navigation" | "semantic navigation" | "ObjectNav")'
  year = "2018-"

  [[track.step]]
  key = "social-navigation"
  label = "人のいる環境でのナビゲーション"
  aim = "群衆の中を、人に迷惑をかけずに進むための研究"
  query = '("social navigation" | "crowd navigation" | "human-aware navigation" | "socially aware")'
  year = "2015-"

  [[track.step]]
  key = "navigation-foundation"
  label = "基盤モデル時代のナビゲーション"
  aim = "GNM・ViNT・NoMaD・LLM/VLM を使ったナビゲーションで何が変わったか"
  query = '("navigation foundation model" | "general navigation model" | ViNT | NoMaD | ("large language model" + navigation) | ("vision-language model" + navigation))'
  year = "2022-"

