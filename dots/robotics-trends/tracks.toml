[[track]]
key = "sensors-hardware"
folder = "4_センサー・ハードウェア"
label = "センサー・ハードウェア"
weekday = "thu"
# ハードと、それを測るセンサーを1回にまとめて読む(1回の本数をテーマごとに分け合うので、他の曜日と同じ8段階で終わる)
arxiv = 'cat:cs.RO AND (abs:sensor OR abs:calibration OR abs:tactile OR abs:IMU OR abs:actuator OR abs:mechanism OR abs:gripper OR abs:hardware)'

  [[track.step]]
  key = "joints-actuators"
  label = "関節とアクチュエータ"
  aim = "モータ・減速機・柔軟関節・準直接駆動で、ロボットの関節をどう作るか"

    [[track.step.part]]
    # アクチュエータの基礎
    query = '(actuator | "electric motor" | "gear reducer" | "harmonic drive" | backdrivable | backdrivability) + (robot | joint | manipulator)'
    year = "2000-"

    [[track.step.part]]
    # 柔軟関節と準直接駆動
    query = '("series elastic actuator" | "quasi-direct drive" | "proprioceptive actuator" | "variable stiffness actuator" | "compliant actuator")'
    year = "1995-"

  [[track.step]]
  key = "body-sensing"
  label = "体の状態を測る(力覚・トルク・IMU)"
  aim = "力センサ・関節トルク・慣性計測で、自分の体の状態をどう知るか"

    [[track.step.part]]
    # 力覚・トルク・固有受容
    query = '("force/torque sensor" | "force sensing" | "joint torque" | proprioception | "force estimation") + (robot | manipulator | legged)'
    year = "2005-"

    [[track.step.part]]
    # IMU と慣性計測
    query = '(IMU | "inertial measurement unit" | preintegration | gyroscope | accelerometer) + (robot | navigation | estimation | calibration)'
    year = "2005-"

  [[track.step]]
  key = "legged-humanoid-hardware"
  label = "脚とヒューマノイドの機構"
  aim = "走れる脚と全身のヒューマノイドを、どう設計してきたか"

    [[track.step.part]]
    # 脚ロボットの機構
    query = '("legged robot" | quadruped | biped) + (design | hardware | mechanism | actuator | leg)'
    year = "2005-"

    [[track.step.part]]
    # ヒューマノイドのハードウェア
    query = 'humanoid + (design | hardware | actuator | platform | mechanism)'
    year = "2005-"

  [[track.step]]
  key = "cameras"
  label = "カメラ(キャリブレーション・深度・ステレオ)"
  aim = "カメラのモデルと較正、深度カメラとステレオで3Dを測る"

    [[track.step.part]]
    # カメラモデルとキャリブレーション
    query = '("camera calibration" | "extrinsic calibration" | "intrinsic calibration" | "hand-eye calibration" | "camera-IMU")'
    year = "1998-"

    [[track.step.part]]
    # 深度カメラとステレオ
    query = '("RGB-D" | "depth camera" | "stereo matching" | "time-of-flight" | "depth estimation" | KinectFusion)'
    year = "2010-"

  [[track.step]]
  key = "hands-touch"
  label = "手(ハンド・グリッパと触覚)"
  aim = "掴むための機構と、触って分かるためのセンサ"

    [[track.step.part]]
    # ロボットハンドとグリッパ
    query = '("robot hand" | "robotic hand" | gripper | "underactuated hand" | "end effector") + (design | mechanism | grasping)'
    year = "2005-"

    [[track.step.part]]
    # 触覚センサ
    query = '("tactile sensor" | "tactile sensing" | GelSight | "vision-based tactile" | "electronic skin")'
    year = "2012-"

  [[track.step]]
  key = "range-sensing"
  label = "測距センサ(LiDAR とレーダー)"
  aim = "LiDAR とレーダーで距離を測る原理と、ロボットでの使い分け"

    [[track.step.part]]
    # LiDAR と測距センサ
    query = '(lidar | "laser scanner" | "range sensor" | "laser range finder") + (robot | perception | calibration | mapping)'
    year = "2005-"

    [[track.step.part]]
    # レーダーと新しいセンサ
    query = '(radar | mmWave | "4D radar" | "millimeter-wave") + (robot | odometry | perception | SLAM | localization)'
    year = "2015-"

  [[track.step]]
  key = "soft-lowcost"
  label = "ソフトロボットと低コスト・オープンなハード"
  aim = "柔らかくて安全なロボットと、安く作ってデータを集める流れ"

    [[track.step.part]]
    # ソフトロボティクス
    query = '("soft robot" | "soft robotics" | "soft actuator" | "pneumatic actuator" | "soft gripper")'
    year = "2010-"

    [[track.step.part]]
    # 低コスト・オープンなハードウェア
    query = '("low-cost" | "open-source" | affordable | inexpensive) + (robot | "robot arm" | hardware | manipulator | platform)'
    year = "2015-"

  [[track.step]]
  key = "fast-robots"
  label = "速く動くロボット(ドローンとイベントカメラ)"
  aim = "空を飛ぶロボットの機体と制御、速い動きを捉えるイベントカメラ"

    [[track.step.part]]
    # 空を飛ぶロボット
    query = '(quadrotor | multirotor | "aerial robot" | "aerial manipulation" | UAV | drone) + (design | control | hardware | manipulation)'
    year = "2010-"

    [[track.step.part]]
    # イベントカメラ
    query = '("event camera" | "event-based vision" | "dynamic vision sensor" | "neuromorphic vision")'
    year = "2014-"

