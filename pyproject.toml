[project]
name = "local-dots"
version = "0.1.0"
description = "ローカル LLM で動く、担当を持ったエージェントの枠組み"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
localdots = "localdots.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["localdots"]
